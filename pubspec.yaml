name: barav_quiz
description: "BARAV QUIZ —  باراڤ کویز"
publish_to: "none"

version: 1.0.1+23

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  flutter_local_notifications: ^22.3.0
  http: ^1.6.0
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  font_awesome_flutter: ^11.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  cached_network_image: ^4.0.0
  pinput: ^6.0.2
  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#10172A"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/languages/translations.json
    - assets/sounds/30second_tick.mp3
    - assets/sounds/quiz_start.mp3
    - assets/sounds/timer_tick.mp3
    - assets/sounds/answer_correct.mp3
    - assets/sounds/answer_wrong.mp3
    - assets/sounds/next_question.mp3
    - assets/sounds/winners.mp3
    - assets/sounds/level_up.mp3
    - assets/sounds/notification_message.mp3

  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
